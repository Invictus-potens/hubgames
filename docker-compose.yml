services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubgames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubgames}
      POSTGRES_DB: hubgames
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubgames"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hubgames:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hubgames:${POSTGRES_PASSWORD:-hubgames}@postgres:5432/hubgames
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
